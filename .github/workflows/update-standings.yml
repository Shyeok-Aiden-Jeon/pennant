name: Update KBO standings

on:
  schedule:
    - cron: '10 13 * * *'
    - cron: '10 14 * * *'
    - cron: '40 15 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install requests beautifulsoup4

      - name: Scrape standings
        run: python scrape_kbo.py

      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain standings.json)" ]; then
            git config user.name  "kbo-bot"
            git config user.email "kbo-bot@users.noreply.github.com"
            git add standings.json
            git commit -m "chore: update standings"
            git push
          else
            echo "No change."
          fi
