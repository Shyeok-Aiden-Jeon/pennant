name: Update KBO standings

on:
  schedule:
    # KST 경기 시간대(오후 5시~다음날 새벽 1시)에 30분마다 갱신.
    # GitHub Actions는 UTC 기준이라 KST-9시간으로 표기했습니다.
    # KST 17:00~23:30 = UTC 08:00~14:30  /  KST 00:00~01:00 = UTC 15:00~16:00
    - cron: '0,30 8-16 * * *'
  workflow_dispatch:      # 수동 실행 버튼

permissions:
  contents: write

concurrency:
  group: standings-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install requests beautifulsoup4

      - name: Scrape standings
        run: python scrape_kbo.py

      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain standings.json)" ]; then
            git config user.name  "kbo-bot"
            git config user.email "kbo-bot@users.noreply.github.com"
            git add standings.json
            git commit -m "chore: update standings"
            git push
          else
            echo "No change."
          fi
